<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Press Photos | Eve's Lily EPK</title>
  <meta name="description" content="Galeri dokumentasi panggung dan festival Eve's Lily untuk kebutuhan media, promotor, dan press kit.">
  <link rel="icon" type="image/png" href="./assets/brand/lily-icon-only.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Italiana&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Lewati ke konten utama</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="./index.html" class="brand-link" aria-label="Beranda Eve's Lily EPK">
        <img src="./assets/brand/lily-icon-only.png" alt="" aria-hidden="true" class="brand-link__icon" width="28" height="27">
        <img src="./assets/brand/wordmark-text-only.png" alt="Eve's Lily" class="brand-link__wordmark" width="107" height="17">
      </a>

      <nav class="nav-desktop" aria-label="Navigasi utama">
        <a href="./index.html" class="nav-link">Home</a>
        <a href="./press-photos.html" class="nav-link" aria-current="page">Press Photos</a>
        <a href="./biography.html" class="nav-link">Biography</a>
        <a href="./schedule.html" class="nav-link">Schedule</a>
      </nav>

      <button type="button" id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="mobile-drawer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
        <span>Menu</span>
      </button>
    </div>
  </header>

  <div id="mobile-drawer" class="mobile-drawer" data-open="false" aria-hidden="true">
    <div id="drawer-backdrop" class="mobile-drawer__backdrop"></div>
    <div class="mobile-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="mobile-drawer__head">
        <h2 id="drawer-title" class="mobile-drawer__title">
          <img src="./assets/brand/lily-icon-only.png" alt="" aria-hidden="true" class="brand-link__icon" width="26" height="25">
          <img src="./assets/brand/wordmark-text-only.png" alt="Eve's Lily" class="brand-link__wordmark" width="101" height="16">
        </h2>
        <button type="button" id="drawer-close" class="icon-btn" aria-label="Tutup menu navigasi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <nav class="mobile-drawer__links" aria-label="Navigasi seluler">
        <a href="./index.html" class="mobile-drawer__link">Home</a>
        <a href="./press-photos.html" class="mobile-drawer__link" aria-current="page">Press Photos</a>
        <a href="./biography.html" class="mobile-drawer__link">Biography</a>
        <a href="./schedule.html" class="mobile-drawer__link">Schedule</a>
      </nav>
      <div class="mobile-drawer__foot">
        <a href="#contact" class="btn btn--primary">Hubungi Booking</a>
      </div>
    </div>
  </div>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1 class="page-hero__title">Press Photos</h1>
      </div>
    </section>

    <section class="band band--cosmos" aria-label="Galeri Press Photos">
      <div class="container">
        <div class="filter-bar">
          <div id="press-filters" class="filter-chips" role="group" aria-label="Filter tahun foto panggung"></div>
          <a href="./index.html" class="btn btn--outline-dark btn--sm">Kembali ke Home</a>
        </div>

        <div id="press-gallery" class="gallery-grid">
          <div class="state-box" role="status" style="grid-column:1/-1">
            <p class="state-box__title">Memuat galeri foto panggung...</p>
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="contact-band" aria-label="Kontak dan media sosial Eve's Lily">
      <div class="container contact-band__inner">
        <div class="state-box" role="status">
          <p class="state-box__title">Memuat kontak booking...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner site-footer__inner--center">
      <p style="margin:0">&copy; Eve's Lily, Banjarmasin. Electronic Press Kit.</p>
    </div>
  </footer>

  <script type="module" src="./js/page-press.js"></script>
</body>
</html>
